map:
  # Collider triangles crossing this world-Z plane become obstacles.
  slice_world_z: 0.50
  min_world_xy: [-4.0, -6.0]
  max_world_xy: [4.0, 2.0]
  resolution: 0.05

planning:
  # Extra obstacle clearance beyond the measured robot footprint, in metres.
  safety_margin: 0.10
  waypoint_spacing: 0.10
  max_endpoint_snap_distance: 0.50
